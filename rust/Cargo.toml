[package]
name = "fcc"
version = "0.4.2"
edition = "2024"
description = "fcc build tool"
license = "MIT"
publish = false

[dependencies]
crc32fast = "1.5.5"
rand = "0.8"
rand_pcg = "0.3"
sha2 = "0.11.1"
thiserror = "2.0.21"
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
