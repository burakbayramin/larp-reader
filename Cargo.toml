[package]
name = "larp-reader"
version = "0.5.1"
edition = "2024"
rust-version = "1.88"
description = "larpr build tool"
license = "MIT"
publish = false

[lib]
name = "larp_reader"

[[bin]]
name = "larpr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.5"
ego-tree = "0.11"
encoding_rs = "0.8.44"
mobi = "0.8"
pdf_oxide = "0.3.78"
quick-xml = "0.42.0"
rand = "0.8"
rand_pcg = "0.3"
ratatui = "0.30.2"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-width = "0.2.3"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
