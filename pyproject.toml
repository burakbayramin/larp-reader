[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fcc"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
  "textual",
  "pygments",
  "pymupdf",
  "ebooklib",
  "beautifulsoup4",
  "python-docx",
  "odfpy",
  "striprtf",
  "mobi",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
fcc = "fcc.cli:main"

[tool.hatch.version]
path = "src/fcc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fcc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore:imghdr was removed:DeprecationWarning:mobi",
]
