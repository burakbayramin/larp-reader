[package]
name = "fcc"
version = "0.4.2"
edition = "2024"
description = "fcc build tool"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.5"
rand = "0.8"
rand_pcg = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
